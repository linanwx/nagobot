# nagobot container deployment.
#
# Minimal start: put at least one provider key in .env (e.g.
# DEEPSEEK_API_KEY=sk-...) and run `docker compose up -d`. Config and all
# session data live in ./data on the host (bind mount) — back it up with tar
# or rsync directly, and migrate an existing bare-metal ~/.nagobot by
# unpacking it into ./data before first start. Updating = pull a new image,
# never in-place self-update.
#
# Pre-think embedding (the semantic layer of the `destructive` detector, plus
# search/coder/skills routing) uses a remote backend: a SILICONFLOW_API_KEY or
# OPENROUTER_API_KEY enables it. Without either, that layer degrades to regex
# — every feature still works, but destructive-action detection is much weaker.

services:
  nagobot:
    image: ghcr.io/linanwx/nagobot:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/root/.nagobot
    environment:
      # First-boot config bootstrap (ignored once config.yaml exists):
      - NAGOBOT_PROVIDER=${NAGOBOT_PROVIDER:-deepseek}
      - NAGOBOT_MODEL=${NAGOBOT_MODEL:-deepseek-v4-flash}
      # Provider keys / channel tokens — read live from env, set what you have.
      # SILICONFLOW_API_KEY / OPENROUTER_API_KEY also power pre-think embedding.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
