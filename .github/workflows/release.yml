name: Release

on:
  push:
    tags: ['v*']
  # Manual release from main. The tag is created by `gh release create
  # --target` below, inside Actions, rather than pushed from a client — which
  # is what lets a release be cut from an environment that may push branches
  # but not tags (cloud agent sessions). A tag created with GITHUB_TOKEN does
  # NOT trigger this workflow's push leg, so this one run does the whole
  # release itself; there is no double build.
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to create on the current main commit, e.g. v1.7.85'
        required: true
        type: string

permissions:
  contents: write

# One name for the release whichever leg started the run: the pushed tag, or
# the dispatch input. Every step below reads this, never github.ref_name,
# which is "main" on a dispatch.
env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "dispatch only from main (got $GITHUB_REF)"; exit 1; }
          echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $RELEASE_TAG"; exit 1; }
          if gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "tag $RELEASE_TAG already exists"; exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build binaries (parallel)
        run: |
          VERSION="${RELEASE_TAG}"
          LDFLAGS="-s -w -X github.com/linanwx/nagobot/cmd.Version=${VERSION}"
          pids=""
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            OUT="nagobot-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then OUT="${OUT}.exe"; fi
            echo "Building ${OUT}..."
            GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags="$LDFLAGS" -o "$OUT" . &
            pids="$pids $!"
          done
          for pid in $pids; do wait "$pid" || exit 1; done
          sha256sum nagobot-* > checksums.txt

      - name: Create Release
        run: gh release create "$RELEASE_TAG" nagobot-* checksums.txt --target "${{ github.sha }}" --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # One runner per architecture, each building natively, then a merge job that
  # stitches the two digests into one multi-arch tag.
  #
  # This replaced a single x86 runner driving both platforms through QEMU. The
  # arm64 leg was emulated end to end, which was tolerable while the runtime
  # stage was just apt+pip — it stopped being tolerable once that stage started
  # unpacking ~1GB of chromium and running its post-install under emulation.
  # GitHub's arm64 runners are free for public repositories, so the emulation
  # was pure cost with nothing bought.
  #
  # The go build itself was never the emulated part: the build stage pins
  # --platform=$BUILDPLATFORM and cross-compiles. On a native arm64 runner that
  # pin simply becomes a no-op.
  docker:
    # After `release`, so a dispatch rejected by its validation step (or a
    # failed binary build) never publishes an image under that tag.
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive platform slug
        run: echo "PLATFORM_SLUG=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only — the tag is applied once, by the merge job below.
      # Tagging here instead would have the two runners race to own the same
      # tag, and whichever finished last would win it for its architecture alone.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/nagobot,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}

      # The file NAME carries the digest, stripped of its "sha256:" prefix — the
      # merge job re-adds that prefix when it rebuilds the references, so
      # leaving it on would produce "@sha256:sha256:…".
      - name: Export digest
        run: |
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -eux
          repo="ghcr.io/${{ github.repository_owner }}/nagobot"
          docker buildx imagetools create \
            -t "${repo}:${{ env.RELEASE_TAG }}" \
            -t "${repo}:latest" \
            $(printf "${repo}@sha256:%s " *)
          docker buildx imagetools inspect "${repo}:${{ env.RELEASE_TAG }}"
